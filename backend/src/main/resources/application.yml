spring:
  application:
    name: backend

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:teamup}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:teamup}
    password: ${DB_PASSWORD:teamup}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      # 개발 초기엔 update로 엔티티 기준 테이블을 만들고,
      # DB 설계서 기준 schema.sql이 준비되면 validate로 바꿉니다.
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Seoul
    show-sql: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  jackson:
    time-zone: Asia/Seoul
    date-format: yyyy-MM-dd'T'HH:mm:ss

server:
  port: 8080

jwt:
  # 로컬 개발용 기본값입니다. 배포할 때는 반드시 JWT_SECRET 환경 변수로 32자 이상 임의 문자열을 넣으세요.
  secret: ${JWT_SECRET:local-dev-only-secret-change-me-0123456789}
  access-token-expiration: ${JWT_EXPIRATION:PT24H}

app:
  cors:
    # 프론트 개발 서버 주소 (여러 개면 쉼표로 구분)
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    org.hibernate.SQL: debug
