# 로컬 개발용 MySQL + Redis
# 실행: docker compose up -d   (backend 폴더에서)
# 종료: docker compose down
services:
  mysql:
    image: mysql:8.0
    container_name: teamup-mysql
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-teamup}
      MYSQL_USER: ${DB_USERNAME:-teamup}
      MYSQL_PASSWORD: ${DB_PASSWORD:-teamup}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --ngram_token_size=2
    volumes:
      - mysql-data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: teamup-redis
    ports:
      - "6379:6379"

volumes:
  mysql-data:
